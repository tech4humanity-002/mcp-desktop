<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>MCP Desktop</title><link rel="icon" href="https://pflisxkcxbzboxwidywf.supabase.co/storage/v1/object/public/images/AHC%20droid%20head.webp"><style>
:root{font:14px system-ui;color:#e8edf4;background:#0b0e12}*{box-sizing:border-box}body{margin:0;height:100vh;overflow:hidden}button,select,textarea,input{font:inherit}button{cursor:pointer}.app{height:100vh;display:grid;grid-template-columns:205px 1fr 270px}.side,.right{background:#0d1116;padding:14px}.side{border-right:1px solid #282e37}.right{border-left:1px solid #282e37}.brand{font-weight:800;letter-spacing:.1em;margin-bottom:16px}.brand img{width:29px;height:29px;vertical-align:middle;border-radius:8px;margin-right:8px}.nav button,.ws{display:block;width:100%;text-align:left;background:transparent;color:#adb7c4;border:0;padding:8px;border-radius:7px}.nav .active,.ws.active{background:#181e25;color:#fff}.label{font-size:10px;color:#687484;letter-spacing:.1em;margin:16px 0 6px}.main{display:grid;grid-template-rows:58px 1fr 105px}.top{display:flex;align-items:center;gap:8px;padding:10px;border-bottom:1px solid #282e37}.sp{flex:1}.top button,.pill{background:#151b22;color:#c3ccd7;border:1px solid #343c47;border-radius:8px;padding:7px 10px}.panes{display:grid;grid-template-columns:repeat(3,minmax(230px,1fr));gap:9px;padding:10px;overflow:auto}.pane{border:1px solid #282e37;border-radius:9px;background:#11161d;display:grid;grid-template-rows:44px 1fr;min-height:400px}.panehead{display:flex;padding:7px;border-bottom:1px solid #282e37}.panehead select{flex:1;background:#141a21;color:#dce4ed;border:1px solid #343c47;border-radius:7px}.panehead button{background:transparent;border:0;color:#778}.msgs{padding:11px;overflow:auto}.msg{white-space:pre-wrap;line-height:1.5;margin-bottom:10px}.user{margin-left:auto;max-width:90%;background:#1a2736;padding:9px;border-radius:10px}.compose{border-top:1px solid #282e37;padding:9px}.drop{border:1px dashed #3c4551;color:#788493;padding:6px;margin-bottom:6px;font-size:11px}.box{display:flex;gap:8px;background:#131920;border:1px solid #35404c;border-radius:9px;padding:7px}.box textarea{flex:1;min-height:58px;background:transparent;color:#fff;border:0;outline:0;resize:none}.send{background:#edf0f4;color:#090c10;border:0;border-radius:7px;padding:9px 14px}.card{background:#11161d;border:1px solid #282e37;border-radius:9px;padding:10px;margin-bottom:8px}.idea{width:100%;text-align:left;background:#151b22;color:#dce4ed;border:1px solid #303944;border-radius:7px;padding:8px;margin:3px 0}.idea small{display:block;color:#737f8e;margin-top:3px}.toggle{display:flex;justify-content:space-between;padding:6px;font-size:11px;color:#c0c8d3}@media(max-width:1000px){.app{grid-template-columns:175px 1fr}.right{display:none}}@media(max-width:650px){.app{grid-template-columns:1fr}.side{display:none}.panes{grid-template-columns:1fr}}
</style></head><body><div class="app"><aside class="side"><div class="brand"><img src="https://pflisxkcxbzboxwidywf.supabase.co/storage/v1/object/public/images/AHC%20droid%20head.webp">OIKOS · MCP DESKTOP</div><div class="nav"><button class="active">Conversations</button><button>Workspaces</button><button>Models & tokens</button><button>Plugins</button><button>Instructions & recipes</button><button>Automation</button></div><div class="label">WORKSPACES</div><button class="ws active">Personal</button><button class="ws">Project</button><button id="connect">Connect account</button></aside><main class="main"><header class="top"><b>Conversations</b><div class="sp"></div><span class="pill">BYOK · session</span><button id="broadcast">Broadcast: ON</button><button id="add">+ Pane</button></header><div id="panes" class="panes"></div><div class="compose"><div id="drop" class="drop">Drop a document, transcript, CSV, JSON or text here to extract it.</div><form id="form"><div class="box"><textarea id="q" placeholder="Ask once. Broadcast to the active conversations."></textarea><button class="send">Send</button></div></form><div id="receipt" style="font-size:10px;color:#687484"></div></div></main><aside class="right"><div class="card"><b>Start with a conversation</b><button class="idea" data-p="Pressure-test this idea from five perspectives: customer, operator, finance, risk and contrarian.">Test an idea<small>5-person challenge</small></button><button class="idea" data-p="Build and critique a marketing campaign using strategy, creative, customer, commercial and risk perspectives.">Marketing campaign<small>strategy + creative + commercial</small></button><button class="idea" data-p="Make a decision. Compare options, evidence gaps and a recommended path.">Make a decision<small>decision team</small></button><button class="idea" data-p="Research this topic. Find evidence, contradictions, unknowns and next actions.">Research a topic<small>research team</small></button></div><div class="card"><b>Import & extract</b><label class="toggle">Summarise <input id="summary" type="checkbox" checked></label><label class="toggle">Extract actions & evidence <input type="checkbox" checked></label><label class="toggle">Keep receipts <input type="checkbox" checked></label></div><div class="card"><b>Plugins</b><label class="toggle">Agent Teams <input type="checkbox"></label><label class="toggle">Web search <input type="checkbox"></label><label class="toggle">Automation tasks <input type="checkbox"></label><label class="toggle">Shell <input type="checkbox"></label></div></aside></div>
<script>
const M=[["openai/gpt-5-mini","GPT-5 mini"],["anthropic/claude-sonnet-4","Claude Sonnet"],["google/gemini-2.5-flash","Gemini Flash"],["x-ai/grok-4","Grok"],["deepseek/deepseek-flash","DeepSeek"],["perplexity/sonar-pro","Perplexity"]],$=id=>document.getElementById(id);let lanes=M.slice(0,3).map(x=>({model:x[0],history:[]})),broadcast=true;
function draw(){$("panes").innerHTML=lanes.map((l,i)=>'<section class="pane"><div class="panehead"><select data-model="'+i+'">'+M.map(m=>'<option value="'+m[0]+'" '+(m[0]===l.model?"selected":"")+'>'+m[1]+'</option>').join("")+'</select><button data-remove="'+i+'">×</button></div><div class="msgs">'+(l.history.length?l.history.map(m=>'<div class="msg '+(m.role==="user"?"user":"")+'"><small>'+m.role+' · '+l.model+'</small><br>'+String(m.content).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))+'</div>').join(""):'<div style="color:#697586">One conversation pane.<br>Pick a model or add another.</div>')+'</div></section>').join("");document.querySelectorAll("[data-model]").forEach(x=>x.onchange=e=>{lanes[+e.target.dataset.model].model=e.target.value;draw()});document.querySelectorAll("[data-remove]").forEach(x=>x.onclick=()=>{if(lanes.length>1){lanes.splice(+x.dataset.remove,1);draw()}})}
async function run(l,text){l.history.push({role:"user",content:text},{role:"assistant",content:""});draw();const h={"content-type":"application/json"},key=sessionStorage.getItem("mcpdt");if(key)h["x-mcp-desktop-openrouter-key"]=key;const r=await fetch("https://t4h-universal-chat.troy-latter.workers.dev/api/chat/stream",{method:"POST",headers:h,body:JSON.stringify({messages:l.history,model:l.model,metadata:{surface:"mcp-desktop"}})});if(!r.ok)throw Error((await r.text()).slice(0,300));const rd=r.body.getReader(),d=new TextDecoder();let b="";for(;;){const z=await rd.read();if(z.done)break;b+=d.decode(z.value,{stream:true});const parts=b.split("\n\n");b=parts.pop()||"";for(const part of parts){const line=part.split("\n").find(x=>x.startsWith("data: "));if(!line)continue;const x=JSON.parse(line.slice(6));if(x.type==="delta"){l.history[l.history.length-1].content+=x.content;draw()}if(x.type==="done")$("receipt").textContent="REAL · "+x.actual_model+" · "+x.latency_ms+"ms · receipt "+x.receipt_id}}}
$("form").onsubmit=async e=>{e.preventDefault();const t=$("q").value.trim();if(!t)return;$("q").value="";await Promise.all((broadcast?lanes:[lanes[0]]).map(l=>run(l,t).catch(x=>{l.history.push({role:"assistant",content:"Error: "+x.message});draw()})))};$("broadcast").onclick=()=>{broadcast=!broadcast;$("broadcast").textContent=broadcast?"Broadcast: ON":"Broadcast: OFF"};$("add").onclick=()=>{lanes.push({model:M[lanes.length%M.length][0],history:[]});draw()};document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{$("q").value=b.dataset.p;$("q").focus()});$("drop").ondragover=e=>e.preventDefault();$("drop").ondrop=async e=>{e.preventDefault();const f=e.dataTransfer.files[0];if(!f)return;const text=await f.text();$("q").value=($("summary").checked?"Summarise and extract facts, decisions, actions, evidence and unanswered questions from this material.\n\n":"Review this material.\n\n")+text.slice(0,30000);$("receipt").textContent="Imported "+f.name+" · ready to process"};$("connect").onclick=()=>{const k=prompt("OpenRouter token. Stored in this browser session only.");if(k)sessionStorage.setItem("mcpdt",k)};draw();
</script></body></html>
